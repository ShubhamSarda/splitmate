<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Splitmate</title>
    <script>
      // Apply the saved theme before first paint to avoid a light-mode flash.
      // No saved preference -> light (the product default).
      (function () {
        try {
          if (localStorage.getItem("splitmate_theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch {
          /* localStorage unavailable — stay light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
